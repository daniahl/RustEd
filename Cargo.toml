[package]
name = "rusted"
version = "0.5.0"
edition = "2021"

[lib]
name = "rusted"
path = "src/lib.rs"
test = false
doctest = false

[[bin]]
name = "RustEd"
path = "src/main.rs"
test = false

[dependencies]
eframe = "0.31"
egui_extras = { version = "0.31", features = ["syntect"] }
portable-pty = "0.8"
rfd = "0.18.0"
vt100 = "0.15"

[dev-dependencies]
accesskit_consumer = "0.26"


# Optimize dependencies (egui text layout, syntect) even in debug builds;
# they dominate edit latency on large files.
[profile.dev.package."*"]
opt-level = 3

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
panic = "abort"
strip = true
