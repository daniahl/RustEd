[package]
name = "rusted"
version = "0.6.0"
edition = "2021"

[lib]
name = "rusted"
path = "src/lib.rs"
test = false
doctest = false

[[bin]]
name = "RustEd"
path = "src/main.rs"
test = false

[dependencies]
eframe = "0.37"
egui_extras = { version = "0.37.0", features = ["syntect"] }
portable-pty = "0.9.0"
rfd = "0.18.0"
vt100 = "0.18.1"

[target.'cfg(windows)'.dependencies]
raw-window-handle = "0.6"
windows = { version = "0.62", features = [
    "Win32_Foundation",
    "Win32_Graphics_Gdi",
    "Win32_Storage_FileSystem",
    "Win32_System_IO",
    "Win32_System_Threading",
    "Win32_UI_Accessibility",
    "Win32_UI_Shell",
    "Win32_UI_WindowsAndMessaging",
] }

[dev-dependencies]
accesskit_consumer = "0.39.2"


# Optimize dependencies (egui text layout, syntect) even in debug builds;
# they dominate edit latency on large files.
[profile.dev.package."*"]
opt-level = 3

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
panic = "abort"
strip = true
